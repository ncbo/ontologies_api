# Workflow for deploying ontologies_api to stage/prod systems via capistrano.
# This workflow runs after a successeful execution of the unit test workflow and it
# can also be triggered manually.
#
# Required github secrets:
#
# CONFIG_REPO - github repo containing config and customizations for the API. Format 'author/private_config_repo'
# it is used for getting capistrano deployment configuration for stages on the github actions runner and
# PRIVATE_CONFIG_REPO env var is constructed from it which is used by capistrano on the remote servers for pulling configs.
#
# GH_PAT - github Personal Access Token for accessing PRIVATE_CONFIG_REPO
#
# SSH_JUMPHOST - ssh jump/proxy host though which deployments have to though if app servers are hosted on private network.
#
# DEPLOY_ENC_KEY - key for decrypting deploymnet ssh key residing in config/deploy_id_rsa_enc (see miloserdow/capistrano-deploy)
# this SSH key is used for accessing jump host, UI nodes, and private github repo.
name: Capistrano Deployment

permissions:
  contents: read

on:
  # Trigger deployment to staging after unit test action completes
  workflow_run:
    workflows: ["Ruby Unit Tests"]
    types:
      - completed
    branches: [develop]  # trigger auto deployment to staging from develop branch
  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch/tag to deploy'
        default: develop
        required: true
      environment:
        description: 'target environment to deploy to'
        type: choice
        options:
          - staging
          - production
        default: staging

jobs:
  deploy:
    concurrency:
      group: deploy
    runs-on: ubuntu-latest
    # run deployment only if "Ruby Unit Tests" workflow completes sucessefully
    # or when manually triggered
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch')
    env:
      BUNDLE_WITHOUT: default:test:development #install gems required primarily for the deployment in order to speed this workflow
      PRIVATE_CONFIG_REPO: ${{ format('git@github.com:{0}.git', secrets.CONFIG_REPO) }}
    steps:
    - name: set branch/tag and environment to deploy from inputs
      run: |
        if [ "${{ github.event_name }}" = "workflow_run" ]; then
          # Auto: always deploy develop to staging
          echo "BRANCH=develop" >> "$GITHUB_ENV"
          # echo "BRANCH=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_ENV"  # auto deploy from branch if needed
          echo "TARGET=staging" >> "$GITHUB_ENV"
        else
          # Manual: use inputs, with defaulting via parameter expansion
          USER_INPUT_BRANCH=${{ inputs.branch }}
          USER_INPUT_ENVIRONMENT=${{ inputs.environment }}

          echo "BRANCH=${USER_INPUT_BRANCH:-develop}" >> "$GITHUB_ENV"
          echo "TARGET=${USER_INPUT_ENVIRONMENT:-staging}" >> "$GITHUB_ENV"
        fi
    # GITHUB_SHA is the commit the workflow file was read from (the ref the run
    # was dispatched on), not what capistrano deploys. Resolve BRANCH to the
    # commit it points to now, so the deployment info and the New Relic marker
    # name the deployed code. Capistrano fetches the branch a few seconds later,
    # so a push in between would still make them differ.
    - name: Resolve the commit being deployed
      run: |
        if [[ "${BRANCH}" =~ ^[0-9a-f]{40}$ ]]; then
          DEPLOY_SHA=${BRANCH}
        else
          # For an annotated tag, prefer the peeled ^{} entry: the commit, not the tag object.
          DEPLOY_SHA=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
              "refs/heads/${BRANCH}" "refs/tags/${BRANCH}" "refs/tags/${BRANCH}^{}" 2>/dev/null |
            awk -v b="${BRANCH}" '
              $2 == "refs/heads/" b      { head = $1 }
              $2 == "refs/tags/" b "^{}" { peeled = $1 }
              $2 == "refs/tags/" b       { tag = $1 }
              END { print (head ? head : (peeled ? peeled : tag)) }')
        fi
        echo "DEPLOY_SHA=${DEPLOY_SHA}" >> "$GITHUB_ENV"
    - name: Provide deployment info
      run: |
        echo "=== Deployment Details ======================================"
        echo "Time:        $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
        echo "Branch/Tag:  ${BRANCH}"
        echo "Environment: ${TARGET}"
        echo "Commit:      ${DEPLOY_SHA:-unresolved}"
        echo "Workflow:    ${GITHUB_SHA}"
        echo "Triggered by: ${GITHUB_ACTOR}"
        echo "Event:       ${GITHUB_EVENT_NAME}"
        if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
          echo "Mode:        auto-deploy from develop"
        else
          echo "Mode:        manual deployment"
        fi
        echo "=============================================================="
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v5
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: get-deployment-config
      uses: actions/checkout@v5
      with:
        repository: ${{ secrets.CONFIG_REPO }} # repository containing deployment settings
        token: ${{ secrets.GH_PAT }} # `GH_PAT` is a secret that contains your PAT
        path: deploy_config
    - name: copy-deployment-config
      run: cp -r deploy_config/ontologies_api/* .
    # add ssh hostkey so that capistrano doesn't complain
    - name: Add jumphost's hostkey to Known Hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.SSH_JUMPHOST }} > ~/.ssh/known_hosts
      shell: bash
    - uses: miloserdow/capistrano-deploy@v3
      with:
        target: ${{ env.TARGET }} # which environment to deploy
        deploy_key: ${{ secrets.DEPLOY_ENC_KEY }} # Name of the variable configured in Settings/Secrets of your github project

    # Announce the deployment to New Relic (Change Tracking).
    # Runs only after a successful capistrano deploy (previous steps fail-fast).
    # `continue-on-error` keeps a telemetry hiccup from marking the deploy failed.
    #
    # Required config:
    #   secret NEW_RELIC_API_KEY - New Relic User API key (starts with NRAK-)
    #
    # The target APM entity is resolved by app_name read from the deployed
    # config/newrelic.yml (synced from the private config repo into the runner
    # workspace above), so no entity GUID needs to be stored here. The app_name
    # in that file matches the New Relic entity name per environment.
    - name: Read New Relic app_name from config for ${{ env.TARGET }}
      run: |
        NAME=$(ruby -ryaml -e 'cfg = YAML.safe_load_file("config/newrelic.yml", aliases: true); print(cfg.fetch(ENV["TARGET"], {})["app_name"] || cfg.dig("common", "app_name"))')
        echo "NR_APP_NAME=${NAME}" >> "$GITHUB_ENV"
    - name: Record deployment in New Relic
      if: ${{ env.NR_APP_NAME != '' }}
      continue-on-error: true
      uses: newrelic/deployment-marker-action@v2.6.2
      with:
        apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
        region: "US" # change to "EU" for EU-hosted New Relic accounts
        commandType: "changeTrackingCreateEvent"
        entitySearch: "name = '${{ env.NR_APP_NAME }}' AND type = 'APPLICATION' AND domain = 'APM'"
        category: "Deployment"
        type: "Basic"
        # Fall back to the branch name alone if the commit couldn't be resolved,
        # rather than recording the workflow's own commit as the deployed one.
        version: "${{ env.DEPLOY_SHA && format('{0}@{1}', env.BRANCH, env.DEPLOY_SHA) || env.BRANCH }}"
        commit: "${{ env.DEPLOY_SHA }}"
        user: "${{ github.actor }}"
        description: "Deployed ontologies_api to ${{ env.TARGET }}"
        changelog: "https://github.com/${{ github.repository }}/commits/${{ env.DEPLOY_SHA || env.BRANCH }}"
